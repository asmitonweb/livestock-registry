global:
  hostname: connector.nsr.openg2p.org
  postgresqlHost: commons-postgresql
  postgresqlPort: 5432
  redisHost: nsr-redis-master
  redisPort: 6379
  partnerApiService: nsr-partner-api
  connectorDB: nsr_connector
  connectorDBUser: nsr_connector_user
  connectorDBSecret: nsr-connector
  connectorDBUserPasswordKey: nsr-connector-db-user
  metadataDsnSecret: ""
  masterDataDsnKey: master_data_dsn
  registryDsnKey: registry_db_dsn

imagePullSecrets: []

# Extra environment for every connector container, beyond the fixed set
# commonEnv renders. Use it for settings the service reads directly, such as
# CONNECTOR_ODK_*; extraEnvFrom takes an env valueFrom block, for secrets.
#
#   extraEnv:
#     CONNECTOR_ODK_CENTRAL_BASE_URL: https://odk-central.example.org
#     CONNECTOR_ODK_PROJECT_ID: "13"
#   extraEnvFrom:
#     CONNECTOR_ODK_CENTRAL_PASSWORD:
#       secretKeyRef:
#         name: farmer-connector-odk
#         key: password
extraEnv: {}
extraEnvFrom: {}

commonEnv:
  CONNECTOR_DB_DRIVER: postgresql+asyncpg
  CONNECTOR_LOG_LEVEL: INFO
  CONNECTOR_STORE_RUN_PAYLOADS: "true"
  CONNECTOR_STRICT_INCREMENTAL: "true"
  CONNECTOR_FULL_SCAN_ON_INCREMENTAL_UNSUPPORTED: "false"
  CONNECTOR_METRICS_ENABLED: "true"
  CONNECTOR_CORS_ORIGINS: https://connector.nsr.openg2p.org

postgresCheckerInit:
  enabled: true
  image: jbergknoff/postgresql-client:latest

api:
  enabled: true
  replicaCount: 1
  image:
    repository: openg2p/openg2p-connector-service
    tag: nsr
    pullPolicy: Always
  command:
    - api
  service:
    port: 80
    targetPort: 8050
  resources: {}
  startupProbe:
    initialDelaySeconds: 0
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 30
  livenessProbe:
    initialDelaySeconds: 20
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 6
  readinessProbe:
    initialDelaySeconds: 0
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80

worker:
  enabled: true
  replicaCount: 1
  image:
    repository: openg2p/openg2p-connector-service
    tag: nsr
    pullPolicy: Always
  command:
    - worker
  resources: {}

beat:
  enabled: true
  replicaCount: 1
  image:
    repository: openg2p/openg2p-connector-service
    tag: nsr
    pullPolicy: Always
  command:
    - beat
  resources: {}

consumer:
  enabled: false
  replicaCount: 1
  image:
    repository: openg2p/openg2p-connector-service
    tag: nsr
    pullPolicy: Always
  command:
    - consumer
  resources: {}

ui:
  enabled: true
  replicaCount: 1
  image:
    repository: openg2p/openg2p-connector-ui
    tag: nsr
    pullPolicy: Always
  service:
    port: 80
    targetPort: 8080
  resources: {}
  livenessPath: /
  readinessPath: /

istio:
  enabled: true
  gateway:
    create: false
    name: internal
  virtualservice:
    enabled: true
    gateway: internal
    apiPrefixes:
      - /connectors
      - /runs
      - /dlq
      - /metadata
      - /health
      - /webhook

postgres-init:
  enabled: true
  postgresql:
    host: "{{ .Values.global.postgresqlHost }}"
    port: 5432
    existingSecret: commons-postgresql
    existingSecretPostgresPasswordKey: postgres-password
  databases:
    - name: "{{ .Values.global.connectorDB }}"
      user: "{{ .Values.global.connectorDBUser }}"
      secret: "{{ .Values.global.connectorDBSecret }}"
      secretUserPasswordKey: "{{ .Values.global.connectorDBUserPasswordKey }}"
