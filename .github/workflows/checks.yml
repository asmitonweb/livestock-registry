name: Checks

# Fast, Docker-free checks that gate a change before the build: the
# openg2p-registry pin stays in lockstep across the Dockerfiles and the chart,
# and the ODK form, transform and ingestion log agree with each other.

on:
  push:
    branches: ["**", "!dependabot/**"]
  pull_request:

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet pytest jinja2 openpyxl
      - name: openg2p-registry pin lockstep
        run: python -m pytest test/test_rp_pin_lockstep.py -q
      - name: ODK forms, transform and ingestion log
        run: python -m pytest test/test_odk_forms.py test/test_odk_transform.py test/test_odk_ingest_events.py test/test_odk_location_media.py -q
